[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-model"
version = "0.1.0"
description = "具身智能 & 自动驾驶世界模型训练模块 — TsingtaoAI"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "pillow>=11.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.6",
  "torchvision>=0.21",
]
train = [
  "gsplat>=1.5",
  "ninja>=1.11",
  "tensorboard>=2.18",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]
