server {
    listen 8003 ssl;
    http2 on;
    server_name embodatahub.tsingtaoai.com;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html/spa;
    index index.html;

    # 数据集上传很大,不能沿用 nginx 默认的 1m
    client_max_body_size 0;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/wasm application/xml image/svg+xml text/css text/javascript text/plain text/xml;

    # ================= 子应用 API 鉴权 (auth_request -> NestJS) =================
    # 内部子请求,不对外开放;只校验 cookie 里的 authtoken。
    # 主站认证是 cookie 的(authtoken, Path=/),子应用已收口到同域 => 浏览器自动带上,
    # 前端零改动;校验逻辑留在 NestJS 一处,自动继承过期/吊销/角色。
    location = /__auth {
        internal;
        proxy_pass http://127.0.0.1:3000/auth/validate-token;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 401 时给子应用 API 返 JSON,别落到主站 SPA 的 index.html
    location @unauth_api {
        default_type application/json;
        return 401 '{"detail":"未认证或登录已过期"}';
    }

    # ================= 产物下载: 后端签发限时签名 URL =================
    # ⚠️ Rerun 的 WASM viewer 是自己在内部 fetch .rrd 的,不带 cookie
    #    (实测: 同一时刻其它请求 200/201,唯独它 401),因此走不了上面的 auth_request。
    #    改为后端签发 ?exp=&sig= 限时签名: 这里放行,由后端校验签名。
    #    前缀比 /rds-app/api/ 长,nginx 取最长前缀 => 本块优先。
    location ^~ /rds-app/api/artifacts/ {
        proxy_pass http://127.0.0.1:8005/api/artifacts/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # 74MB 的 .rrd,别落磁盘临时文件
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ================= 子应用: 数据集质检 (React, base=/rds-app/) =================
    # ⚠️ 注意: /rds/ 是 NestJS 的 API 前缀(/rds/projects, /rds/datasets ...),
    #    子应用不能再占用 /rds/,故挂在 /rds-app/
    location ^~ /rds-app/api/ {
        auth_request /__auth;
        error_page 401 = @unauth_api;
        proxy_pass http://127.0.0.1:8005/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # RDS 有 SSE 进度流
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ================= 子应用: Spark Studio (Vue, base=/spark/) =================
    location ^~ /spark/api/ {
        auth_request /__auth;
        error_page 401 = @unauth_api;
        proxy_pass http://127.0.0.1:8004/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ================= 子应用静态资源 (命中即长缓存) =================
    # 两个子应用各自 build.outDir = dist/<名>,挂载的是它们各自的 dist 父目录。
    # root 指向该父目录,URI 前缀 <名>/ 恰好是它下面的子目录名 —— 这样重建的只是
    # dist/<名>,父目录 inode 不变,bind mount 不会被换掉。
    location ~* ^/rds-app/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|wasm)$ {
        root /srv/rds-holder;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* ^/rds-app/rerun/ {
        root /srv/rds-holder;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* ^/spark/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|wasm)$ {
        root /srv/spark-holder;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ================= 子应用入口 (普通前缀, 让上面的正则能生效) =================
    location /rds-app/ {
        root /srv/rds-holder;
        try_files $uri $uri/ /rds-app/index.html;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy credentialless;
        # html 必须每次校验:无缓存头时浏览器会按 Last-Modified 做启发式缓存,
        # 重建后 iframe 里仍跑旧包(带 hash 的 assets 不受影响,照旧长缓存)。
        add_header Cache-Control "no-cache";
    }
    location /spark/ {
        root /srv/spark-holder;
        try_files $uri $uri/ /spark/index.html;
        add_header Cache-Control "no-cache";
    }

    # ================= 主站静态资源 =================
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ================= 主站 API (含 /rds/, 走 NestJS) =================
    location ~ ^/(api|auth|graphql|swagger|\.well-known|user|files|projects|oldProject|mission|missions|topic|tag|category|actions|worker|templates|hooks|triggers|integrations|access|rds|metrics)(/|\?|$) {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/oauth {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @spa {
        root /usr/share/nginx/html/spa;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 418 = @spa;
}
